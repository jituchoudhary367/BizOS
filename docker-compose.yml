version: '3.8'

services:
  # ─── Frontend ────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api-gateway

  # ─── API Gateway (NestJS) ───────────────────────────────
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
      - order-service
      - inventory-service
      - finance-service
      - staff-service
      - notification-service

  # ─── Order Service ──────────────────────────────────────
  order-service:
    build:
      context: ./apps/order-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - redis

  # ─── Inventory Service ─────────────────────────────────
  inventory-service:
    build:
      context: ./apps/inventory-service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - .env
    depends_on:
      - redis

  # ─── Finance Service ───────────────────────────────────
  finance-service:
    build:
      context: ./apps/finance-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - .env
    depends_on:
      - redis

  # ─── Staff Service ─────────────────────────────────────
  staff-service:
    build:
      context: ./apps/staff-service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - .env

  # ─── Notification Service ──────────────────────────────
  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    env_file:
      - .env
    depends_on:
      - redis

  # ─── AI Service (FastAPI) ──────────────────────────────
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  # ─── Redis (BullMQ queues) ─────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
